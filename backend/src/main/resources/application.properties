spring.application.name=backend

# --- Server ---
# Railway injects PORT; fall back to 8080 locally.
server.port=${PORT:8080}

# --- Datasource ---
# In Railway, set these to reference the Postgres plugin variables.
# Locally they default to the docker-compose Postgres service.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tervisehull}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tervisehull}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tervisehull}

# --- JPA / Hibernate ---
# Use 'validate' plus Flyway/Liquibase migrations in production.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# --- Actuator (health probe for Railway healthcheck) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
